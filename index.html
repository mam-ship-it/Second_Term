<style>
:root{--bg:#f3f6fb;--bg2:#e6edf8;--card:rgba(255,255,255,.78);--tx:#0f1b33;--mut:#586783;--bd:rgba(15,27,51,.10);--pri:#0b7a75;--pri2:#2563eb;--acc:#ff6b5b;--ok:#12a150;--bad:#e03131;--sh:0 10px 40px -12px rgba(15,27,51,.25);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#070d1a;--bg2:#0c1730;--card:rgba(20,32,58,.62);--tx:#eaf1ff;--mut:#9db0d0;--bd:rgba(160,190,255,.14);--pri:#2dd4bf;--pri2:#60a5fa;--acc:#ff8a7a;--sh:0 14px 50px -14px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font-family:'IBM Plex Sans Arabic',Cairo,system-ui,sans-serif;line-height:1.75;background:var(--bg);min-height:100vh;overflow-x:hidden}

body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0,#000 20%,transparent 75%)}
#rp{position:fixed;top:0;inset-inline:0;height:3px;z-index:20;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--acc));transform-origin:right;transform:scaleX(0)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,calc(50% - 560px));background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;cursor:pointer;letter-spacing:.3px}.logo b{color:var(--pri)}
.lm{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;box-shadow:0 6px 18px -4px var(--pri)}
main{max-width:1120px;margin:0 auto;padding:22px 16px 80px}#app>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}#app>*:nth-child(2){animation-delay:.07s}#app>*:nth-child(3){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s,border-color .3s}
.cc{position:relative;overflow:hidden}.cc::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--c,var(--pri)),transparent)}
.cc::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;inset-inline-end:-60px;top:-70px;background:var(--c,var(--pri));opacity:.16;filter:blur(30px);transition:opacity .3s}
.grid>.cc:hover{transform:translateY(-6px);border-color:var(--c,var(--pri))}.cc:hover::after{opacity:.35}
.cc h3{margin:8px 0 2px;font-size:19px}.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c,var(--pri)) 18%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--pri)) 40%,transparent)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:12px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 8px 22px -8px var(--pri);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.s{background:transparent;color:var(--pri);border:1px solid var(--pri);box-shadow:none}.btn.d{background:var(--bad);box-shadow:none}.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--tx);font:inherit;margin:4px 0 12px;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 22%,transparent)}
label{font-weight:600;font-size:14px}label.ck{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer;font-weight:500;transition:.2s}label.ck:hover,label.ck:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}label.ck input{width:auto;margin:0;accent-color:var(--pri)}
.msg{padding:12px 16px;border-radius:14px;margin:12px 0;background:var(--card);border:1px solid var(--bd)}.msg.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.msg.er{border-color:var(--bad);color:var(--bad)}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--bd)}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:9px 12px;text-align:start;direction:ltr}th{background:color-mix(in srgb,var(--pri) 14%,transparent)}
.en{direction:ltr;text-align:left}.note{background:color-mix(in srgb,var(--acc) 12%,transparent);border-inline-start:4px solid var(--acc);padding:10px 14px;border-radius:12px;margin:12px 0;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:14px}
.chip{display:inline-block;padding:2px 11px;border-radius:99px;border:1px solid var(--bd);font-size:12px;margin:2px}.chip.a{border-color:var(--ok);color:var(--ok)}.chip.p{border-color:#d97706;color:#d97706}.chip.r{border-color:var(--bad);color:var(--bad)}
.q{margin:16px 0}.opt{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--bd);border-radius:14px;margin:7px 0;cursor:pointer;direction:ltr;text-align:left;transition:.2s}.opt:hover{border-color:var(--pri);transform:translateX(3px)}.opt:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}.opt input{width:auto;margin:0;accent-color:var(--pri)}.opt.good{border-color:var(--ok);background:rgba(18,161,80,.16)}.opt.wrong{border-color:var(--bad);background:rgba(224,49,49,.14)}
.qbar{position:sticky;top:64px;z-index:6;height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:10px 0}.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .35s}
.code{font-size:24px;font-weight:700;letter-spacing:3px;direction:ltr;user-select:all;color:var(--pri)}
h2,h3{margin:8px 0}h2{font-size:clamp(22px,3.4vw,30px)}.lesson{padding:26px}.lesson p,.lesson li{direction:ltr;text-align:left;font-size:17px}.lesson h3{direction:ltr;text-align:left;color:var(--pri);font-size:21px;margin-top:22px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:30px 0 40px}
.hero h1{font-size:clamp(32px,5.4vw,58px);line-height:1.2;margin:0 0 14px;font-weight:700;letter-spacing:-.5px}.hero p{font-size:18px;max-width:34em}
.hv{position:relative;height:340px}.hv .gc{position:absolute;padding:14px 18px;border-radius:20px;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:var(--sh);animation:fl 6s ease-in-out infinite}
.gc.a{top:0;inset-inline-start:0;width:78%}.gc.b{top:130px;inset-inline-end:0;animation-delay:-2s}.gc.c{bottom:0;inset-inline-start:8%;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-12px)}}.ecg{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 3.2s linear infinite}@keyframes dr{to{stroke-dashoffset:-420}}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px}.stats div{font-size:13px;color:var(--mut)}.stats b{display:block;font-size:26px;color:var(--tx)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:10px 0 36px}.feat .card{padding:18px}.feat .ic{margin-bottom:8px}.sec{margin:34px 0 14px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--pri)) calc(var(--p)*1%),var(--bd) 0);position:relative}.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg2)}.ring b{position:relative;font-size:14px}
.sk{height:120px;border-radius:20px;margin:12px 0;background:linear-gradient(90deg,var(--bd),transparent,var(--bd));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.fcc{perspective:1000px}.fcc>div{animation:pop .45s both}@keyframes pop{from{transform:rotateY(90deg) scale(.9);opacity:0}}
a{color:var(--pri)}iframe{box-shadow:var(--sh)}
@media(max-width:780px){.hero{grid-template-columns:1fr}.hv{height:260px}.lesson{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#off{position:sticky;top:0;z-index:30;background:#d97706;color:#fff;text-align:center;padding:6px;font-size:14px}#off[hidden]{display:none}
.bell{position:relative;background:transparent;border:1px solid var(--bd);border-radius:12px;padding:5px 10px;cursor:pointer;font-size:16px;color:var(--tx)}.bell sup{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--acc);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
#np{position:fixed;top:62px;inset-inline-start:16px;width:min(340px,92vw);z-index:40;max-height:60vh;overflow:auto}#np[hidden]{display:none}#np div{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.ck2{font-size:13px;color:var(--mut);direction:rtl;white-space:nowrap}@media(max-width:620px){.ck2{display:none}}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:10px 0 90px}
.pk{position:relative;cursor:pointer;border:2px solid var(--bd);border-radius:20px;padding:18px;background:var(--card);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.pk:hover{transform:translateY(-4px)}.pk.on{border-color:var(--c);box-shadow:0 14px 40px -14px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.pk .tick{position:absolute;top:12px;inset-inline-end:12px;width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:#fff;font-weight:700;transition:.25s}
.pk.on .tick{background:var(--c);border-color:var(--c);transform:scale(1.15)}.pk .tick::after{content:"✓";opacity:0}.pk.on .tick::after{opacity:1}
.pk h3{margin:10px 0 0}.pk small{display:block;direction:ltr;text-align:left}
.bar{position:fixed;bottom:0;inset-inline:0;z-index:15;padding:12px max(16px,calc(50% - 540px));background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--bd);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar b{font-size:22px}

@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--solid:#fff}@media(prefers-color-scheme:dark){:root{--solid:#101b33}}
.cc,.pk{--ring:color-mix(in srgb,var(--c,var(--pri)) 20%,transparent);isolation:isolate;border:2px solid transparent;
 background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c,var(--pri)) 24%,transparent),transparent 70%) padding-box,linear-gradient(var(--solid),var(--solid)) padding-box,conic-gradient(from var(--a),var(--ring),var(--c,var(--pri)) 14%,var(--ring) 32%,var(--ring)) border-box;
 animation:spin 5s linear infinite,glow 3.2s ease-in-out infinite;
 transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .3s;will-change:transform}
@keyframes spin{to{--a:360deg}}
@keyframes glow{0%,100%{box-shadow:0 10px 30px -14px var(--c,var(--pri)),0 0 0 0 transparent}50%{box-shadow:0 18px 46px -10px var(--c,var(--pri)),0 0 26px -4px color-mix(in srgb,var(--c,var(--pri)) 55%,transparent)}}
.cc::before{inset:0;height:auto;border-radius:inherit;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);transform:translateX(-130%);animation:sw 4.8s ease-in-out infinite}
.grid>.cc:nth-child(2)::before,.pick>.pk:nth-child(2)::before{animation-delay:.9s}.grid>.cc:nth-child(3)::before,.pick>.pk:nth-child(3)::before{animation-delay:1.8s}.grid>.cc:nth-child(4)::before,.pick>.pk:nth-child(4)::before{animation-delay:2.7s}
.pk::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);transform:translateX(-130%);animation:sw 4.8s ease-in-out infinite}
@keyframes sw{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cc>*,.pk>*{position:relative;z-index:2}
.cc .ic,.pk .ic{animation:bob 3.4s ease-in-out infinite;box-shadow:0 0 22px -4px color-mix(in srgb,var(--c,var(--pri)) 60%,transparent)}@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.grid>.cc,.pick>.pk{animation:spin 5s linear infinite,glow 3.2s ease-in-out infinite,pin .8s cubic-bezier(.2,.9,.3,1.25) backwards}
.grid>.cc:nth-child(1),.pick>.pk:nth-child(1){animation-delay:0s,0s,.05s}.grid>.cc:nth-child(2),.pick>.pk:nth-child(2){animation-delay:0s,.4s,.18s}.grid>.cc:nth-child(3),.pick>.pk:nth-child(3){animation-delay:0s,.8s,.31s}.grid>.cc:nth-child(4),.pick>.pk:nth-child(4){animation-delay:0s,1.2s,.44s}
@keyframes pin{from{opacity:0;transform:translateY(40px) scale(.88) rotateX(18deg)}}
.grid>.cc:hover,.pk:hover{translate:0 -6px}
.pk.on{animation:spin 2.2s linear infinite,glow 1.6s ease-in-out infinite,pf .7s ease-out}@keyframes pf{0%{filter:brightness(1.7) saturate(1.4)}100%{filter:none}}
.pk.on .tick{animation:tk .5s cubic-bezier(.3,1.8,.5,1)}@keyframes tk{from{transform:scale(0) rotate(-120deg)}}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:5;background:var(--c);animation:pt .8s ease-out forwards}
@keyframes pt{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.hero h1{background:linear-gradient(100deg,var(--tx) 30%,var(--pri) 55%,var(--tx) 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:tx 6s linear infinite}@keyframes tx{to{background-position:-220% 0}}
.btn{position:relative;overflow:hidden}.btn:not(.s):not(.d)::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-130%);animation:sw 3.6s ease-in-out infinite}
.fl{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;transition:.2s}.fl.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.kv span:first-child{color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;position:sticky;top:62px;z-index:7;padding:6px 0}
.lhero{display:flex;gap:16px;align-items:center;padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--c),#2563eb)}.lhero span{font-size:52px}.lhero .mut{color:#ffffffcc}
.bdg{display:inline-block;padding:2px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid var(--c);font-weight:700}
.info{padding:22px;border-radius:20px;background:var(--solid);border:1px solid var(--bd)}.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.ib{border-radius:18px;padding:16px;border-top:6px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--solid))}.ii{font-size:34px}.il{font-size:13px;color:var(--mut);margin-top:5px}
.stage{aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#0f1b33,#16264a);color:#eaf1ff;display:grid;place-items:center;padding:24px}
.sc{width:100%;max-width:820px;direction:ltr;text-align:left}.sc h2{color:var(--c,#2dd4bf)}.si{font-size:56px;animation:bob 3s infinite}
.sp2{margin:9px 0;padding:10px 14px;border-radius:12px;background:#ffffff14;border-inline-start:4px solid var(--c);animation:rise .6s both}
@media print{header,.tabs,.btn,.bar,#rp,.row{display:none!important}.info{border:0}}

/* ===== FUTURE THEME ===== */
:root{--bg:#050a16;--bg2:#0a1430;--card:rgba(16,28,56,.55);--tx:#eaf1ff;--mut:#9db0d0;--bd:rgba(150,190,255,.16);--pri:#2dd4bf;--pri2:#60a5fa;--acc:#ff8a7a;--sh:0 18px 60px -20px #000;--solid:#101b33;color-scheme:dark}
body::before{background:radial-gradient(600px 400px at 15% 10%,#2dd4bf40,transparent 60%),radial-gradient(700px 500px at 85% 0,#2563eb50,transparent 60%),radial-gradient(600px 500px at 60% 100%,#a78bfa38,transparent 60%),linear-gradient(#050a16,#0a1430);background-size:140% 140%;animation:au 16s ease-in-out infinite alternate}
@keyframes au{to{background-position:30% 20%;filter:hue-rotate(28deg)}}
header{background:rgba(8,16,36,.72);border-bottom:1px solid var(--bd);box-shadow:0 10px 40px -20px #000,0 1px 0 #2dd4bf33}
.lm{animation:pls 2.4s infinite;--c:var(--pri)}
#nav{gap:6px}.tb0{background:transparent;border:0;color:var(--mut);padding:8px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;position:relative;display:flex;gap:6px;align-items:center;transition:.2s}.tb0:hover{color:var(--tx);background:#ffffff0d}.tb0.on{color:var(--tx);background:#ffffff12}
.tb0.on::after{content:"";position:absolute;inset-inline:22%;bottom:1px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--pri),var(--pri2));box-shadow:0 0 12px var(--pri)}
.uchip{font-size:13px;color:var(--mut);padding:5px 12px;border:1px solid var(--bd);border-radius:99px}@media(max-width:760px){.tb0 span,.uchip{display:none}}
.chero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:26px;border-radius:28px;border:1px solid var(--bd);background:radial-gradient(500px 220px at 90% 0,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%),var(--card);backdrop-filter:blur(16px);box-shadow:var(--sh)}
.cem{font-size:62px;display:grid;place-items:center;width:112px;height:112px;border-radius:30px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);box-shadow:0 0 44px -6px var(--c);animation:bob 3.4s ease-in-out infinite}
.cht{flex:1;min-width:240px}.cht h2{font-size:clamp(28px,4vw,44px);background:linear-gradient(100deg,#fff,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;margin:2px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--c);font-weight:700}.chips{margin:8px 0 12px}
.ring.big{width:112px;height:112px}.ring.big::before{inset:9px}.ring.big b{font-size:24px}

.nd{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:18px}.nd .dt{grid-column:2;grid-row:1}.nd .cd{grid-row:1}.nd.a .cd{grid-column:1}.nd.b .cd{grid-column:3}

.dt.dn{background:linear-gradient(135deg,var(--c),var(--pri2));border-color:transparent;box-shadow:0 0 26px -2px var(--c);color:#06101f}.dt.cu{border-color:var(--c);animation:pls 1.8s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 18px transparent}100%{box-shadow:0 0 0 0 transparent}}
.cd{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:16px 20px;cursor:pointer;transition:.3s}.cd:hover{transform:translateY(-4px) scale(1.01);border-color:var(--c);box-shadow:0 18px 50px -18px var(--c)}.cd h3{margin:4px 0;font-size:20px}
@media(max-width:700px){.nd{grid-template-columns:64px 1fr}.nd .dt{grid-column:1}.nd.a .cd,.nd.b .cd{grid-column:2}.path::before{inset-inline-start:32px}}
.dock{position:fixed;bottom:14px;inset-inline:0;margin-inline:auto;width:max-content;max-width:94vw;display:flex;gap:4px;padding:8px;border-radius:24px;background:rgba(10,20,44,.85);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 20px 60px -10px #000,0 0 34px -10px var(--pri);z-index:12}
.dock button{background:transparent;border:0;color:var(--tx);font:inherit;font-size:22px;padding:8px 14px;border-radius:16px;cursor:pointer;display:grid;place-items:center;transition:.2s}.dock button span{font-size:11px;color:var(--mut)}.dock button:hover{background:#ffffff14;transform:translateY(-6px) scale(1.14)}

/* ===== SPLASH (فتح المنصة) ===== */
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:#030713;direction:ltr;transition:opacity .9s ease,transform .9s ease,filter .9s ease}
#splash.out{opacity:0;transform:scale(1.06);filter:blur(10px);pointer-events:none}
#splash .sb{position:absolute;inset:0;background:radial-gradient(520px 420px at 18% 18%,#2dd4bf38,transparent 62%),radial-gradient(640px 480px at 84% 8%,#2563eb55,transparent 62%),radial-gradient(560px 460px at 62% 104%,#a78bfa3a,transparent 62%),linear-gradient(#030713,#08122a);background-size:140% 140%;animation:au 12s ease-in-out infinite alternate}
#splash .sg{position:absolute;inset:-10%;background-image:linear-gradient(rgba(96,165,250,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.13) 1px,transparent 1px);background-size:46px 46px;transform:perspective(600px) rotateX(58deg) translateY(30%);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:sgm 3s linear infinite}
@keyframes sgm{to{background-position:0 46px}}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash .sc0{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;animation:sin .9s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes sin{from{opacity:0;transform:translateY(24px) scale(.92)}}
.orb{position:relative;width:min(340px,74vw);aspect-ratio:1}
.orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb .rt{transform-origin:50% 50%;animation:rot 14s linear infinite}.orb .rt2{transform-origin:50% 50%;animation:rot 22s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.orb .core{position:absolute;inset:11%;border-radius:50%;background:radial-gradient(circle at 50% 45%,#6aa8ff40,#1a3f9a1f 55%,transparent 72%);box-shadow:inset 0 0 40px #2dd4bf22,0 0 70px -10px #2563eb;display:grid;place-items:center;animation:brt 3.2s ease-in-out infinite}
@keyframes brt{50%{box-shadow:inset 0 0 60px #2dd4bf40,0 0 100px -6px #2dd4bf}}
.orb img{width:98%;height:auto;filter:drop-shadow(0 0 14px #60a5fa88) drop-shadow(0 6px 18px #000a);animation:bob 4s ease-in-out infinite}
.pct{margin-top:2px;font:800 15px 'Orbitron',Cairo,monospace;letter-spacing:3px;color:#9fe9df;text-shadow:0 0 12px #2dd4bf}
.wd{display:flex;gap:.04em;font:900 clamp(46px,13vw,88px)/1.1 'Orbitron',Cairo,system-ui,sans-serif;letter-spacing:.02em;margin-top:6px}
.wd span{display:inline-block;opacity:0;background:linear-gradient(180deg,#fff 10%,#7fe9dc 55%,#4f8cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #2dd4bf66);animation:lin .9s cubic-bezier(.2,1.4,.4,1) forwards,wv 2.6s ease-in-out infinite,gl 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.12s + .3s),calc(var(--i)*.12s + 1.4s),calc(var(--i)*.12s + 1.4s)}
.wd .sp{width:.35em}.wd .ai{background:linear-gradient(180deg,#d9fff9,#2dd4bf 50%,#2563eb);-webkit-background-clip:text;background-clip:text}
@keyframes lin{0%{opacity:0;transform:translateY(-60px) rotateX(90deg) scale(.4);filter:blur(12px)}100%{opacity:1;transform:none;filter:drop-shadow(0 0 14px #2dd4bf66)}}
@keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes gl{0%,100%{filter:drop-shadow(0 0 8px #2dd4bf44)}50%{filter:drop-shadow(0 0 22px #60f0e0cc)}}
.tg{font:600 clamp(12px,3.2vw,17px) 'Orbitron',Cairo,sans-serif;letter-spacing:.14em;color:#9db0d0;min-height:1.6em;text-transform:none}
.tg i{display:inline-block;width:2px;height:1em;background:var(--pri);margin-inline-start:3px;vertical-align:-2px;animation:blk .8s steps(1) infinite}@keyframes blk{50%{opacity:0}}
.st{margin-top:10px;direction:rtl;font-size:14px;color:#9db0d0;min-height:1.6em;transition:opacity .3s}
.sbar{width:min(340px,70vw);height:4px;border-radius:9px;background:#ffffff14;overflow:hidden;margin-top:4px}.sbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#2dd4bf,#60a5fa,#a78bfa);box-shadow:0 0 14px #2dd4bf}
</style>
</head>

 <h3 style="margin-top:14px">إجراءات</h3><div class="row">${s.courses.some(c=>c.status==='pending')?B('✅ موافقة وإصدار كود',`mdc();appr(${s.id})`,''):''}${s.code?B('🔑 كود جديد',`mdc();nc(${s.id})`):''}${s.bound?B('🔓 فك القيد (الجهاز)',`mdc();rd(${s.id})`):''}${B(s.status==='blocked'?'▶ إلغاء الإيقاف':'⛔ إيقاف',`if(confirm('${s.status==='blocked'?'إلغاء إيقاف الطالب؟':'إيقاف الطالب؟'}')){mdc();bl(${s.id},'${s.status==='blocked'?'active':'blocked'}')}`,s.status==='blocked'?'':'d')}${hasA(s)?'':B('🗑 حذف نهائي',`mdc();del(${s.id})`,'d')}</div>${hasA(s)?'<div class="mut" style="margin-top:8px">الحذف متاح للطلاب غير المشتركين فقط.</div>':''}</div>`;document.body.appendChild(m)}

document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.cc,.pk');if(!c||e.pointerType!=='mouse')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--ry',x*-10+'deg');c.style.setProperty('--rx',y*-10+'deg');c.style.setProperty('--mx',(x+.5)*100+'%');c.style.setProperty('--my',(y+.5)*100+'%')});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.cc,.pk');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
(function(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;z-index:-1;pointer-events:none';document.body.prepend(c);const x=c.getContext('2d');let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(70,w/18|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};rs();addEventListener('resize',rs);(function f(){x.clearRect(0,0,w,h);P.forEach((p,i)=>{p.x=(p.x+p.vx+w)%w;p.y=(p.y+p.vy+h)%h;x.fillStyle='#2dd4bf99';x.beginPath();x.arc(p.x,p.y,1.6,0,7);x.fill();for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){x.strokeStyle='rgba(96,165,250,'+(1-d/120)*.25+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(f)})()})();

/* ===== SPLASH LOGIC ===== */
(function(){const D=10000,sp=document.getElementById('splash');if(!sp)return;document.documentElement.style.overflow='hidden';
const R=88,C=2*Math.PI*R,r=document.getElementById('spr'),b=document.getElementById('spb'),h=document.getElementById('sph'),h2=document.getElementById('sph2'),p=document.getElementById('spp'),l=document.getElementById('spl'),st=document.getElementById('sps'),tg=document.getElementById('spt');
const TXT='Smart Learning for Better Nursing',MS=[[0,'جاري تجهيز المنصة…'],[18,'تحميل المواد والدروس…'],[42,'تهيئة الاختبارات والبطاقات الذكية…'],[66,'تشغيل الألعاب ثلاثية الأبعاد…'],[88,'لحظات وتكون جاهز…']];
let ti=0;const typ=setInterval(()=>{ti++;tg.innerHTML=TXT.slice(0,ti)+'<i></i>';if(ti>=TXT.length)clearInterval(typ)},90);
// تقدّم سلس: ease-in-out خفيف لكنه ينتهي بالضبط عند 10 ثوانٍ
const ease=t=>t<.5?2*t*t*.6+t*.4:1-Math.pow(-2*t+2,2)/2*.6-(1-t)*.0;
const t0=performance.now();let lastM=-1;
function fr(n){const t=Math.min(1,(n-t0)/D),v=t,pc=Math.round(v*100);
 const off=C*(1-v);r.style.strokeDashoffset=off;b.style.strokeDashoffset=off;
 const a=v*6.2832-1.5708,x=100+Math.cos(a)*R,y=100+Math.sin(a)*R;h.setAttribute('cx',x);h.setAttribute('cy',y);h2.setAttribute('cx',x);h2.setAttribute('cy',y);
 p.textContent=pc+'%';l.style.width=pc+'%';
 let m=0;MS.forEach((q,i)=>{if(pc>=q[0])m=i});if(m!==lastM){lastM=m;st.style.opacity=0;setTimeout(()=>{st.textContent=MS[m][1];st.style.opacity=1},180)}
 if(t<1)requestAnimationFrame(fr);else fin()}
function fin(){clearInterval(typ);sp.classList.add('out');document.documentElement.style.overflow='';setTimeout(()=>sp.remove(),1000)}
requestAnimationFrame(fr);

const c=document.getElementById('spc'),x=c.getContext('2d');let w,hh,P=[];const rs=()=>{w=c.width=innerWidth;hh=c.height=innerHeight;P=Array.from({length:Math.min(80,w/14|0)},()=>({x:Math.random()*w,y:Math.random()*hh,vx:(Math.random()-.5)*.5,vy:-Math.random()*.6-.1,r:Math.random()*1.8+.5,c:Math.random()>.5?'45,212,191':'96,165,250'}))};rs();addEventListener('resize',rs);
(function f(){if(!document.getElementById('spc'))return;x.clearRect(0,0,w,hh);P.forEach(q=>{q.x+=q.vx;q.y+=q.vy;if(q.y<-5){q.y=hh+5;q.x=Math.random()*w}if(q.x<0)q.x=w;if(q.x>w)q.x=0;x.fillStyle='rgba('+q.c+',.75)';x.shadowColor='rgba('+q.c+',1)';x.shadowBlur=8;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()});requestAnimationFrame(f)})();
})();
