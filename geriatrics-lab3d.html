<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر الأجهزة المساعدة</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><style>:root{--bg:#050a16;--bg2:#0a1430;--card:rgba(16,28,56,.72);--tx:#eaf1ff;--mut:#9db0d0;--bd:rgba(150,190,255,.2);--pri:#2dd4bf;--pri2:#60a5fa;--acc:#ff8a7a;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--solid:#101b33}

.cell.s1{background:#2563eb55}.cell.s2{background:#f59e0b55}.cell.s3{background:#7c3aed66}

 document.body.appendChild(o)}
/* اختيار من متعدد (مع وقت اختياري لكل سؤال) */
function mcq(host,title,qs,secs,done){let i=0,ok=0,tm=null,left=0;
 const show=()=>{clearInterval(tm);if(i>=qs.length)return done(Math.round(ok*100/qs.length));
  const q=qs[i],ord=shuf(q.o.map((_,k)=>k));
  host.innerHTML=`<div class="card"><div class="row sp"><b>${title}</b><span class="chip">${i+1}/${qs.length}</span>${secs?`<span class="chip" id="mq">⏱ ${secs}</span>`:''}</div>${secs?`<div class="meter"><i id="mqb" style="width:100%"></i></div>`:''}<p style="font-size:17px">${t(q.a[0],q.a[1])}</p><div class="col">${ord.map(k=>`<button class="btn s opt" data-k="${k}" style="text-align:start">${t(q.o[k][0],q.o[k][1])}</button>`).join('')}</div><div id="mqf" class="mut" style="margin-top:8px;min-height:24px"></div></div>`;
  const ans=k=>{clearInterval(tm);$$('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.c)b.classList.add('good');else if(kk===k)b.classList.add('wrong')});if(k===q.c)ok++;if(q.x)$('#mqf').textContent=t(q.x[0],q.x[1]);setTimeout(()=>{i++;show()},q.x?1800:900)};
  $$('.opt').forEach(b=>b.onclick=()=>ans(+b.dataset.k));
  if(secs){left=secs;tm=setInterval(()=>{left-=.1;const m=$('#mq');if(m)m.textContent='⏱ '+Math.max(0,Math.ceil(left));const b=$('#mqb');if(b)b.style.width=Math.max(0,left/secs*100)+'%';if(left<=0)ans(-1)},100)}};
 show()}
/* تسليم الشيفت ISBAR: رتّب البنود. items بالترتيب الصحيح */
function isbarStage(host,items,done){const order=[],sh=shuf(items.map((_,i)=>i));
 host.innerHTML=`<h3>🗣️ ${t('تسليم الشيفت بطريقة ISBAR','Shift handover with ISBAR')}</h3><p class="mut">${t('اضغط البنود بالترتيب الصحيح: تعريف ← الموقف ← الخلفية ← التقييم ← التوصية','Tap the items in the correct order: Identify → Situation → Background → Assessment → Recommendation')}</p><div id="ib" class="col"></div><div id="io" class="row" style="margin:8px 0"></div>`;
 const draw=()=>{$('#ib').innerHTML=sh.map(i=>`<button class="btn s opt" ${order.includes(i)?'disabled':''} data-i="${i}" style="text-align:start">${t(items[i].a,items[i].e)}</button>`).join('');
  $('#io').innerHTML=order.map((_,n)=>`<span class="chip">${n+1}</span>`).join('')+(order.length?`<button class="btn s sm" id="iu">↩ ${t('تراجع','Undo')}</button>`:'');
  $$('#ib .opt').forEach(b=>b.onclick=()=>{order.push(+b.dataset.i);if(order.length===items.length){const ok=order.filter((v,n)=>v===n).length;done(Math.round(ok*100/items.length))}else draw()});
  const u=$('#iu');if(u)u.onclick=()=>{order.pop();draw()}};
 draw()}
</script><script>const GID='ger_lab3d',W=560,H=420,HT=170;let st=0,sc=0,dev='cane',phase=0,wk=0,raf=0;

{a:['مريض بعد كسر الفخذ، ومحتاج ثبات كبير وما يقدرش يحمّل وزنه كامل:','After a hip fracture, needs high stability and cannot fully bear weight:'],o:[['عكاز واحد','Single cane'],['ووكر (مشاية)','Walker'],['لا شيء','Nothing']],c:1},
{a:['شاب كسر في الساق ومحتاج يتجنب تحميل الوزن:','A young man with a leg fracture who must avoid weight-bearing:'],o:[['عكازات إبطية','Axillary crutches'],['ووكر','Walker'],['عكاز واحد','Single cane']],c:0},
{a:['مسن وصل إنه ما بيقدرش يمشي نهائيًا:','Elderly who can no longer walk at all:'],o:[['عكاز','Cane'],['كرسي متحرك','Wheelchair'],['عكازات','Crutches']],c:1}];
$('#root').innerHTML=`<div class="card"><div class="row sp"><b>🦯 ${t('مختبر الأجهزة المساعدة','Assistive devices lab')}</b><span class="chip" id="ph"></span></div><canvas id="cv" width="${W}" height="${H}"></canvas><div id="ct" style="margin-top:8px"></div></div>`;
const cv=$('#cv'),g=cv.getContext('2d');

 g.strokeStyle='#1d4ed8';g.beginPath();g.moveTo(x,gy-hh*.48);g.lineTo(x,gy-hh*.82);g.stroke();

 g.strokeStyle='#f1c7a1';g.lineWidth=6;g.beginPath();g.moveTo(x,gy-hh*.80);g.lineTo(x+28,gy-hh*.60);g.stroke()}

 g.strokeStyle='#94a3b8';g.lineWidth=5;
 if(phase===0){const h=+$('#sl').value*k;g.beginPath();g.moveTo(x+36,gy);g.lineTo(x+36,gy-h);g.lineTo(x+54,gy-h);g.stroke();g.strokeStyle='#2dd4bf';g.setLineDash([5,5]);g.lineWidth=2;g.beginPath();g.moveTo(40,gy-HT*.53*k);g.lineTo(x+110,gy-HT*.53*k);g.stroke();g.setLineDash([]);g.fillStyle='#fff';g.font='12px sans-serif';g.fillText(t('مستوى المدور الكبير','Greater trochanter'),40,gy-HT*.53*k-6)}
 else if(phase===1){const h=+$('#sl').value*k,ax=gy-HT*.80*k;g.beginPath();g.moveTo(x+38,gy);g.lineTo(x+20,gy-h);g.stroke();g.strokeStyle='#f59e0b';g.lineWidth=2;g.beginPath();g.moveTo(40,ax);g.lineTo(x+110,ax);g.stroke();g.fillStyle='#fff';g.font='12px sans-serif';g.fillText(t('الإبط','Axilla'),40,ax-6)}
 else if(phase===2){g.fillStyle='#fff';g.font='15px sans-serif';g.textAlign='center';g.fillText(dev==='walker'?'🚶‍♂️ walker':dev==='wheel'?'🧑‍🦽':dev==='crutch'?'crutches':'cane',x+90,60)}

function p1(){phase=1;dev='crutch';$('#ph').textContent='2/3';$('#ct').innerHTML=`<p>${t('اظبط طول العكاز الإبطي: الفرق بين الإبط وطرف الوسادة حوالي 2–3 أصابع (4–6 سم).','Adjust the axillary crutch: gap between axilla and pad about 2–3 fingers (4–6 cm).')}</p><div>${t('الطول','Length')}: <b id="sv">110</b> cm · ${t('الفرق','Gap')}: <b id="gp"></b> cm<input id="sl" type="range" min="100" max="150" value="110"></div><div id="fb" style="min-height:24px"></div><button class="btn" id="ck">${t('تأكيد','Confirm')}</button>`;const upd=()=>{const v=+$('#sl').value;$('#sv').textContent=v;$('#gp').textContent=Math.round(HT*.80-v);scene()};$('#sl').oninput=upd;upd();

 $$('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===c.c;$$('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'good':'wrong');if(ok){sc+=125;dev=[ 'cane','walker','crutch','wheel'][ci];if(!raf)loopW();setTimeout(()=>{cancelAnimationFrame(raf);raf=0;wk=0},2200)}$('#fb').textContent=ok?'✅':'❌';setTimeout(()=>{ci++;p2()},2400)});scene()}
