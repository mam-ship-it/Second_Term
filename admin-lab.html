<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر الإدارة</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><style>:root{--bg:#050a16;--bg2:#0a1430;--card:rgba(16,28,56,.72);--tx:#eaf1ff;--mut:#9db0d0;--bd:rgba(150,190,255,.2);--pri:#2dd4bf;--pri2:#60a5fa;--acc:#ff8a7a;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--solid:#101b33}
[data-theme=light]{--bg:#eef3fb;--bg2:#dde8f7;--card:rgba(255,255,255,.92);--tx:#0f1b33;--mut:#53627d;--bd:rgba(15,27,51,.16);--pri:#0b7a75;--pri2:#2563eb;--acc:#e5533f;--solid:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'IBM Plex Sans Arabic',Cairo,system-ui,sans-serif;background:radial-gradient(600px 400px at 12% 0,#2dd4bf2e,transparent 60%),radial-gradient(600px 420px at 92% 8%,#2563eb3d,transparent 60%),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);line-height:1.6}
#root{max-width:920px;margin:0 auto;padding:12px 12px 30px}
h2,h3,h4{margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:600px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}}
.mut{color:var(--mut);font-size:14px}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}.btn:disabled{opacity:.55;cursor:default}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s:hover:not(:disabled){border-color:var(--pri)}
.btn.d{background:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}
.meter{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .2s}
.chip{display:inline-block;padding:2px 11px;border-radius:99px;border:1px solid var(--bd);font-size:13px}
.note{border-inline-start:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);padding:8px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.opt.good{border-color:var(--ok)!important;background:rgba(34,197,94,.18)!important}.opt.wrong{border-color:var(--bad)!important;background:rgba(239,68,68,.16)!important}
.bed,.nur{cursor:pointer;transition:.15s}.bed.alert{border-color:var(--warn);box-shadow:0 0 18px -6px var(--warn)}.nur.sel{border-color:var(--pri);box-shadow:0 0 18px -4px var(--pri)}.nur.off{opacity:.4;pointer-events:none}
canvas{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--bd);background:#0a1430;display:block;margin:auto;touch-action:none}
input[type=range]{width:100%;accent-color:var(--pri)}
select{width:100%;padding:7px;border-radius:10px;border:1px solid var(--bd);background:var(--solid);color:var(--tx);font:inherit}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:center;font-size:14px}th{background:color-mix(in srgb,var(--pri) 14%,transparent)}
.cell{width:100%;padding:6px 0;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.cell.s1{background:#2563eb55}.cell.s2{background:#f59e0b55}.cell.s3{background:#7c3aed66}
.floor{perspective:700px;margin:6px 0}.floor>div{transform:rotateX(48deg);transform-origin:50% 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:14px;background:linear-gradient(#16264a,#0c1730);border:1px solid var(--bd)}
.floor .bd{height:34px;border-radius:6px;background:var(--bd);box-shadow:0 6px 0 rgba(0,0,0,.35);transition:.3s}
#endov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,7,19,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#endov .card{width:min(420px,92vw)}
</style></head><body><div id="root"></div><script>const Q=new URLSearchParams(location.search),EN=Q.get('lang')==='en';
(function(){const d=document.documentElement;d.lang=EN?'en':'ar';d.dir=EN?'ltr':'rtl';if(Q.get('theme')==='light')d.dataset.theme='light'})();
const t=(a,e)=>EN?e:a,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const SKN={kardex:['الكاردكس','Kardex'],isbar:['ISBAR','ISBAR'],shift:['تقرير الشيفت','Shift report'],assign:['التكليف','Assignment'],staff:['تنمية العاملين','Staff development'],incident:['الحوادث','Incidents'],rota:['الروتا','Rota'],problem:['حل المشكلات','Problem solving']};
let DONE=false;
/* يبعت النتيجة للمنصة: {modoGame, score, skills} */
function finish(score,skills){if(DONE)return;DONE=true;score=Math.round(clamp(score,0,100000));skills=skills||{};
 try{parent.postMessage({modoGame:GID,score:score,skills:skills},'*')}catch(e){}
 const o=document.createElement('div');o.id='endov';
 o.innerHTML=`<div class="card" style="text-align:center"><h2>🏁 ${t('انتهت اللعبة','Game over')}</h2><div style="font-size:44px;font-weight:800;color:var(--pri)">${score}</div><div class="mut">${t('نقطة','points')}</div>${Object.keys(skills).map(k=>`<div style="text-align:start;margin:8px 0"><div class="row sp"><span>${SKN[k]?t(SKN[k][0],SKN[k][1]):k}</span><b>${Math.round(skills[k])}%</b></div><div class="meter"><i style="width:${clamp(skills[k],0,100)}%"></i></div></div>`).join('')}<button class="btn" style="margin-top:8px" onclick="location.reload()">${t('العب مرة أخرى','Play again')}</button></div>`;
 document.body.appendChild(o)}
/* اختيار من متعدد (مع وقت اختياري لكل سؤال) */
function mcq(host,title,qs,secs,done){let i=0,ok=0,tm=null,left=0;
 const show=()=>{clearInterval(tm);if(i>=qs.length)return done(Math.round(ok*100/qs.length));
  const q=qs[i],ord=shuf(q.o.map((_,k)=>k));
  host.innerHTML=`<div class="card"><div class="row sp"><b>${title}</b><span class="chip">${i+1}/${qs.length}</span>${secs?`<span class="chip" id="mq">⏱ ${secs}</span>`:''}</div>${secs?`<div class="meter"><i id="mqb" style="width:100%"></i></div>`:''}<p style="font-size:17px">${t(q.a[0],q.a[1])}</p><div class="col">${ord.map(k=>`<button class="btn s opt" data-k="${k}" style="text-align:start">${t(q.o[k][0],q.o[k][1])}</button>`).join('')}</div><div id="mqf" class="mut" style="margin-top:8px;min-height:24px"></div></div>`;
  const ans=k=>{clearInterval(tm);$$('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.c)b.classList.add('good');else if(kk===k)b.classList.add('wrong')});if(k===q.c)ok++;if(q.x)$('#mqf').textContent=t(q.x[0],q.x[1]);setTimeout(()=>{i++;show()},q.x?1800:900)};
  $$('.opt').forEach(b=>b.onclick=()=>ans(+b.dataset.k));
  if(secs){left=secs;tm=setInterval(()=>{left-=.1;const m=$('#mq');if(m)m.textContent='⏱ '+Math.max(0,Math.ceil(left));const b=$('#mqb');if(b)b.style.width=Math.max(0,left/secs*100)+'%';if(left<=0)ans(-1)},100)}};
 show()}
/* تسليم الشيفت ISBAR: رتّب البنود. items بالترتيب الصحيح */
function isbarStage(host,items,done){const order=[],sh=shuf(items.map((_,i)=>i));
 host.innerHTML=`<h3>🗣️ ${t('تسليم الشيفت بطريقة ISBAR','Shift handover with ISBAR')}</h3><p class="mut">${t('اضغط البنود بالترتيب الصحيح: تعريف ← الموقف ← الخلفية ← التقييم ← التوصية','Tap the items in the correct order: Identify → Situation → Background → Assessment → Recommendation')}</p><div id="ib" class="col"></div><div id="io" class="row" style="margin:8px 0"></div>`;
 const draw=()=>{$('#ib').innerHTML=sh.map(i=>`<button class="btn s opt" ${order.includes(i)?'disabled':''} data-i="${i}" style="text-align:start">${t(items[i].a,items[i].e)}</button>`).join('');
  $('#io').innerHTML=order.map((_,n)=>`<span class="chip">${n+1}</span>`).join('')+(order.length?`<button class="btn s sm" id="iu">↩ ${t('تراجع','Undo')}</button>`:'');
  $$('#ib .opt').forEach(b=>b.onclick=()=>{order.push(+b.dataset.i);if(order.length===items.length){const ok=order.filter((v,n)=>v===n).length;done(Math.round(ok*100/items.length))}else draw()});
  const u=$('#iu');if(u)u.onclick=()=>{order.pop();draw()}};
 draw()}
</script><script>const GID='adm_lab',DAYS=[['س','Sa'],['ح','Su'],['ن','Mo'],['ث','Tu'],['ر','We'],['خ','Th'],['ج','Fr']],NURS=['Nurse 1','Nurse 2','Nurse 3','Nurse 4','Nurse 5','Nurse 6'],NA=['ممرض 1','ممرض 2','ممرض 3','ممرض 4','ممرض 5','ممرض 6'];
const G=NURS.map(()=>DAYS.map(()=>0)),SH=[['—','Off'],['ص','M'],['م','E'],['ل','N']];let S={};
function rota(){const R=$('#root');R.innerHTML=`<div class="card"><h3>📅 ${t('جدول الشيفتات (الروتا)','Shift rota')}</h3><p class="mut">${t('اضغط على الخانة لتغيير الشيفت: — راحة / ص صباحي / م مسائي / ل ليلي','Tap a cell to cycle: Off / M morning / E evening / N night')}</p><div class="note">${t('القواعد: كل ممرض يشتغل 5 أيام بالظبط · كل يوم 2 صباحي + 1 مسائي + 1 ليلي على الأقل · ممنوع ليلي ويتبعه صباحي في اليوم التالي','Rules: each nurse works exactly 5 days · each day at least 2 morning + 1 evening + 1 night · no night followed by morning next day')}</div><table><tr><th></th>${DAYS.map(d=>`<th>${t(d[0],d[1])}</th>`).join('')}<th>Σ</th></tr>${G.map((r,i)=>`<tr><th>${t(NA[i],NURS[i])}</th>${r.map((v,j)=>`<td><button class="cell s${v}" data-i="${i}" data-j="${j}">${t(SH[v][0],SH[v][1])}</button></td>`).join('')}<td id="sm${i}">${r.filter(x=>x).length}</td></tr>`).join('')}</table><div id="rs" class="mut" style="margin:8px 0;min-height:24px"></div><button class="btn" id="ck">${t('تحقق وكمّل','Check & continue')}</button></div>`;
 $$('.cell').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j;G[i][j]=(G[i][j]+1)%4;rota()});$('#ck').onclick=chk}
function chk(){let ok=0,tot=0,bad=[];G.forEach((r,i)=>{tot++;if(r.filter(x=>x).length===5)ok++;else bad.push(t(NA[i]+' ≠ 5 أيام',NURS[i]+' ≠ 5 days'))});
 for(let j=0;j<7;j++){[[1,2],[2,1],[3,1]].forEach(([s,m])=>{tot++;if(G.filter(r=>r[j]===s).length>=m)ok++;else bad.push(t('يوم '+DAYS[j][0]+': تغطية '+SH[s][0]+' ناقصة',DAYS[j][1]+': '+SH[s][1]+' coverage short'))})}
 for(let i=0;i<6;i++)for(let j=0;j<6;j++){tot++;if(G[i][j]===3&&G[i][j+1]===1)bad.push(t(NA[i]+': ليلي ثم صباحي',NURS[i]+': night then morning'));else ok++}
 S.rota=ok/tot*100;if(bad.length&&!window._once){window._once=1;$('#rs').innerHTML='⚠️ '+bad.slice(0,6).join(' · ')+(bad.length>6?' …':'')+'<br>'+t('تقدر تعدّل، أو اضغط تحقق تاني للمتابعة.','You can fix it, or press check again to continue.');return}
 kard()}
const KQ=[{a:['الكاردكس هو:','The Kardex is:'],o:[['نظام بطاقات مرجعي سريع بيلخّص خطة رعاية كل مريض','A quick-reference card system summarizing each patient\'s care plan'],['ملف التحاليل الكامل للمريض','The full lab file of the patient'],['جدول مواعيد الأطباء','The doctors\' appointment table'],['فاتورة المريض','The patient\'s invoice']],c:0},
{a:['إيه اللي مش مكانه الكاردكس؟','What does NOT belong in the Kardex?'],o:[['الحساسية','Allergies'],['الأدوية المجدولة','Scheduled medications'],['صورة كاملة من إقرار الموافقة القانونية','A full copy of the legal consent form'],['مستوى النشاط المسموح','Allowed activity level']],c:2},
{a:['إمتى بنحدّث الكاردكس؟','When do we update the Kardex?'],o:[['آخر الشهر','At the end of the month'],['كل ما يتغير أمر علاجي أو حالة المريض','Whenever an order or the patient\'s condition changes'],['لما المريض يخرج بس','Only at discharge'],['مرة في الأسبوع','Once a week']],c:1},
{a:['أهم استخدام للكاردكس عند تغيير الشيفت:','The main use of the Kardex at shift change:'],o:[['التسليم السريع وتوزيع المرضى','Quick handover and patient assignment'],['حساب مرتبات الممرضين','Calculating nurses\' pay'],['حجز غرف جديدة','Booking new rooms'],['الإعلان عن الإجازات','Announcing leaves']],c:0},
{a:['مريض عنده حساسية بنسلين، الأصح:','A patient is allergic to penicillin, the right action:'],o:[['نكتبها بخط صغير','Write it in small print'],['نكتفي بإبلاغ المريض شفهيًا','Only tell the patient verbally'],['نبرزها في الكاردكس وسوار الحساسية بلون واضح','Highlight it in the Kardex and the allergy band in a clear color'],['مش لازم نكتبها','No need to record it']],c:2}];
const PQ=[{a:['أول خطوة في حل المشكلة:','The first step in problem solving:'],o:[['تنفيذ أي حل بسرعة','Implement any quick fix'],['تحديد المشكلة بوضوح وجمع المعلومات','Define the problem clearly and gather information'],['لوم المسؤول','Blame the responsible person'],['تجاهلها','Ignore it']],c:1},
{a:['ممرض غاب في بداية الشيفت، التصرف الأفضل:','A nurse is absent at the start of the shift, the best action:'],o:[['نكمل كأن مفيش حاجة','Carry on as if nothing happened'],['نقيّم شدة الحالات ونعيد التوزيع أو نطلب بديل','Assess acuity and redistribute or request a replacement'],['نمنع الزيارات بس','Just stop visits'],['نؤجل كل الإجراءات','Postpone all procedures']],c:1},
{a:['خلاف بين ممرضين، الأفضل:','Conflict between two nurses, the best approach:'],o:[['نتجاهله لحد ما يخلص','Ignore it until it fades'],['نناقشه قدام الفريق كله','Discuss it in front of the whole team'],['نسمع الاتنين بشكل خاص ونركز على المشكلة مش الأشخاص','Listen to both privately and focus on the issue, not the people'],['ننقل واحد فورًا','Transfer one immediately']],c:2},
{a:['اكتُشف خطأ في جرعة دواء، أول حاجة:','A medication dose error is discovered, the first thing:'],o:[['إخفاؤه','Hide it'],['تأمين سلامة المريض ثم الإبلاغ بتقرير حادث بدون لوم','Ensure patient safety, then report in an incident report without blame'],['معاقبة الممرض فورًا','Punish the nurse immediately'],['انتظار الشكوى','Wait for a complaint']],c:1}];
function kard(){mcq($('#root'),'📋 '+t('الكاردكس','Kardex'),KQ,0,p=>{S.kardex=p;prob()})}
function prob(){mcq($('#root'),'🧩 '+t('حل المشكلات','Problem solving'),PQ,0,p=>{S.problem=p;finish(S.rota*3+S.kardex*3+S.problem*3,S)})}
rota();
</script></body></html>
