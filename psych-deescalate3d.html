/* اختيار من متعدد (مع وقت اختياري لكل سؤال) */

  const ans=k=>{clearInterval(tm);$$('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.c)b.classList.add('good');else if(kk===k)b.classList.add('wrong')});if(k===q.c)ok++;if(q.x)$('#mqf').textContent=t(q.x[0],q.x[1]);setTimeout(()=>{i++;show()},q.x?1800:900)};

 show()}
/* تسليم الشيفت ISBAR: رتّب البنود. items بالترتيب الصحيح */
function isbarStage(host,items,done){const order=[],sh=shuf(items.map((_,i)=>i));

 const draw=()=>{$('#ib').innerHTML=sh.map(i=>`<button class="btn s opt" ${order.includes(i)?'disabled':''} data-i="${i}" style="text-align:start">${t(items[i].a,items[i].e)}</button>`).join('');
  $('#io').innerHTML=order.map((_,n)=>`<span class="chip">${n+1}</span>`).join('')+(order.length?`<button class="btn s sm" id="iu">↩ ${t('تراجع','Undo')}</button>`:'');
  $$('#ib .opt').forEach(b=>b.onclick=()=>{order.push(+b.dataset.i);if(order.length===items.length){const ok=order.filter((v,n)=>v===n).length;done(Math.round(ok*100/items.length))}else draw()});
  const u=$('#iu');if(u)u.onclick=()=>{order.pop();draw()}};

</script><script>const GID='psy_deesc3d',W=640,H=400,SAFE=110,LIM=90;

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
$$('[data-d]').forEach(b=>{const d=b.dataset.d,k={l:'arrowleft',r:'arrowright',u:'arrowup',d:'arrowdown'}[d];b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointerleave=()=>keys[k]=0});

$$('.opt').forEach(b=>b.onclick=()=>{if(over||cd>0)return;const p=PH[+b.dataset.i];cd=1.5;talks++;A=clamp(A+p[2],0,100);say((p[2]<0?'✅ ':'⚠️ ')+t(p[2]<0?'أسلوب متعاطف بيهدّي':'أسلوب أمر/تهديد بيزوّد الهيجان',p[2]<0?'Empathic approach calms':'Commanding/threatening raises agitation'))});

 g.fillStyle='#22c55e';g.fillRect(W-14,260,14,80);g.fillStyle='#bbf7d0';g.font='12px sans-serif';g.textAlign='center';g.fillText(t('مخرج','EXIT'),W-34,252);
